version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: visitor-pass-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - visitor-network

  backend:
    build:
      context: ./backend
    container_name: visitor-pass-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/visitor-pass-db
      - JWT_SECRET=docker_jwt_access_secret_998877665544
      - JWT_REFRESH_SECRET=docker_jwt_refresh_secret_112233445566
      - FRONTEND_URL=http://localhost:5173
      - EMAIL_HOST=smtp.ethereal.email
      - EMAIL_PORT=587
      - EMAIL_FROM=no-reply@visitorpass.com
    depends_on:
      - mongodb
    networks:
      - visitor-network

  frontend:
    build:
      context: ./frontend
    container_name: visitor-pass-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - visitor-network

volumes:
  mongo-data:

networks:
  visitor-network:
    driver: bridge
